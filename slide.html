document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

t: 500;\n    letter-spacing: -0.02em;\n    margin: 8px 0 0;\n    line-height: 1;\n  }\n  .page-header .ph-right {\n    font-family: 'JetBrains Mono', monospace;\n    font-size: 24px;\n    color: var(--ink-2);\n    text-align: right;\n    line-height: 1.4;\n    padding-bottom: 4px;\n  }\n\n  /* ===== Slide 1 — Cover ===== */\n  .cover-top {\n    display: flex;\n    justify-content: space-between;\n    align-items: flex-end;\n    padding-bottom: 28px;\n    border-bottom: 1px solid var(--rule);\n  }\n  .cover-title {\n    font-family: 'Fraunces', serif;\n    font-size: 78px;\n    line-height: 1.0;\n    font-weight: 500;\n    letter-spacing: -0.025em;\n    margin: 20px 0 0;\n    max-width: 1200px;\n  }\n  .cover-title em { font-style: italic; color: var(--pdt); font-weight: 400; }\n  .cover-badge {\n    text-align: right;\n    font-family: 'JetBrains Mono', monospace;\n    font-size: 24px;\n    color: var(--ink-2);\n    line-height: 1.4;\n    padding-bottom: 6px;\n  }\n  .cover-badge .big {\n    font-family: 'Fraunces', serif;\n    font-size: 92px;\n    line-height: 0.85;\n    color: var(--ink);\n    letter-spacing: -0.02em;\n    font-weight: 500;\n    margin-bottom: 8px;\n  }\n  .party-split {\n    flex: 1;\n    display: grid;\n    grid-template-columns: 1fr 1fr;\n    gap: 28px;\n    margin-top: 30px;\n  }\n  .party {\n    background: var(--bg-card);\n    border: 1px solid var(--rule);\n    border-top: 5px solid var(--pdt);\n    border-radius: 4px;\n    padding: 34px 36px 30px;\n    display: flex;\n    flex-direction: column;\n  }\n  .party.mkt { border-top-color: var(--mkt); }\n  .party .p-tag {\n    font-family: 'JetBrains Mono', monospace;\n    font-size: 24px;\n    letter-spacing: 0.1em;\n    text-transform: uppercase;\n    color: var(--pdt);\n  }\n  .party.mkt .p-tag { color: var(--mkt); }\n  .party h3 {\n    font-family: 'Fraunces', serif;\n    font-size: 42px;\n    font-weight: 500;\n    letter-spacing: -0.02em;\n    margin: 10px 0 14px;\n    line-height: 1.02;\ }\n  .raci-row {\n    display: grid;\n    grid-template-columns: 64px 1fr 150px 150px 150px;\n    align-items: center;\n    gap: 18px;\n    padding: 14px 8px;\n    border-bottom: 1px solid var(--rule);\n  }\n  .raci-row.head {\n    border-bottom: 2px solid var(--ink);\n    padding-bottom: 14px;\n  }\n  .raci-row.head .rc {\n    font-family: 'JetBrains Mono', monospace;\n    font-size: 24px;\n    letter-spacing: 0.04em;\n    text-transform: uppercase;\n    color: var(--ink-2);\n    line-height: 1.2;\n  }\n  .raci .gnum {\n    font-family: 'JetBrains Mono', monospace;\n    font-size: 24px;\n    color: var(--ink-3);\n  }\n  .raci .gname {\n    font-size: 26px;\n    font-weight: 500;\n    color: var(--ink);\n  }\n  .raci .cell {\n    text-align: center;\n    font-family: 'JetBrains Mono', monospace;\n    font-size: 24px;\n    color: var(--ink-3);\n    font-weight: 500;\n  }\n  .raci .cell.ra {\n    background: var(--pdt);\n    color: #fff;\n    border-radius: 6px;\n    padding: 10px 0;\n    letter-spacing: 0.04em;\n  }\n  .raci .cell.ra.m { background: var(--mkt); }\n  .raci .cell.ra.g { background: var(--gov); }\n  .raci-legend {\n    margin-top: 22px;\n    display: flex;\n    gap: 36px;\n    font-family: 'JetBrains Mono', monospace;\n    font-size: 24px;\n    color: var(--ink-2);\n  }\n  .raci-legend b { color: var(--ink); }\n\n  /* ===== Timeline / two phase ===== */\n  .timeline {\n    flex: 1;\n    display: grid;\n    grid-template-columns: 1fr 1fr;\n    gap: 32px;\n  }\n  .phase {\n    border: 1px solid var(--rule);\n    border-radius: 6px;\n    padding: 38px 40px;\n    display: flex;\n    flex-direction: column;\n    background: var(--bg-card);\n    position: relative;\n  }\n  .phase.p2 { background: var(--bg-dark); color: var(--bg); border-color: var(--bg-dark); }\n  .phase .pmonth {\n    font-family: 'JetBrains Mono', monospace;\n    font-size: 24px;\n    letter-spacing: 0.08em;\n    color: var(--pdt);\n    text-transform: uppercase;\n  }\n  .phase.p2 .pmonth { color: oklch(0.78 0.10 80); }\n  .phase h3 {\n    font-family: 'Fraunces', serif;\n    font-size: 52px;\n    font-weight: 500;\n    letter-spacing: -0.02em;\n    margin: 12px 0 10px;\n    line-height: 1.0;\n  }\n  .phase .ptag {\n    font-size: 26px;\n    line-height: 1.4;\n    color: var(--ink-2);\n    margin: 0 0 24px;\n  }\n  .phase.p2 .ptag { color: rgba(245,240,230,0.7); }\n  .phase .pgoals {\n    list-style: none; margin: 0; padding: 0;\n    margin-top: auto;\n  }\n  .phase .pgoals li {\n    font-size: 24px;\n    line-height: 1.3;\n    padding: 9px 0 9px 30px;\n    position: relative;\n    border-top: 1px solid var(--rule);\n    color: var(--ink);\n  }\n  .phase.p2 .pgoals li { border-top-color: rgba(245,240,230,0.15); color: var(--bg); }\n  .phase .pgoals li:first-child { border-top: 0; }\n  .phase .pgoals li::before {\n    content: \"→\";\n    position: absolute; left: 0; top: 9px;\n    color: var(--pdt); font-family: 'JetBrains Mono', monospace;\n  }\n  .phase.p2 .pgoals li::before { color: oklch(0.78 0.10 80); }\n  .phase .pgoals li strong { font-weight: 600; }\n\n  /* ===== Generic data table (tools / kpi / roadmap) ===== */\n  .dtable {\n    flex: 1;\n    display: flex;\n    flex-direction: column;\n  }\n  .dt-row {\n    display: grid;\n    align-items: center;\n    gap: 24px;\n    padding: 13px 6px;\n    border-bottom: 1px solid var(--rule);\n  }\n  .dt-row.head {\n    border-bottom: 2px solid var(--ink);\n  }\n  .dt-row.head span {\n    font-family: 'JetBrains Mono', monospace;\n    font-size: 24px;\n    letter-spacing: 0.04em;\n    text-transform: uppercase;\n    color: var(--ink-2);\n  }\n  .dt-row .c-main { font-size: 25px; font-weight: 500; color: var(--ink); line-height: 1.2; }\n  .dt-row .c-sub { font-size: 24px; color: var(--ink-2); line-height: 1.3; }\n  .dt-row .c-owner {\n    font-family: 'JetBrains Mono', monospace;\n    font-size: 24px;\n    letter-spacing: 0.04em;\n  }\n  .ow-p { color: var(--pdt); }\n  .ow-m { color: var(--mkt); }\n  .ow-g { color: var(--gov); }\n\n  /* ===== Roadmap 3 columns ===== */\n  .roadmap {\n    flex: 1;\n    display: grid;\n    grid-template-columns: repeat(3, 1fr);\n    gap: 26px;\n  }\n  .rmcol {\n    background: var(--bg-card);\n    border: 1px solid var(--rule);\n    border-radius: 6px;\n    padding: 30px 30px 26px;\n    display: flex;\n    flex-direction: column;\n  }\n  .rmcol .rm-month {\n    font-family: 'Fraunces', serif;\n    font-size: 64px;\n    line-height: 0.9;\n    font-weight: 500;\n    letter-spacing: -0.02em;\n    color: var(--pdt);\n  }\n  .rmcol:nth-child(2) .rm-month { color: var(--mkt); }\n  .rmcol:nth-child(3) .rm-month { color: var(--gov); }\n  .rmcol .rm-pri {\n    font-family: 'JetBrains Mono', monospace;\n    font-size: 24px;\n    letter-spacing: 0.08em;\n    text-transform: uppercase;\n    color: var(--ink-3);\n    margin: 6px 0 4px;\n  }\n  .rmcol .rm-title {\n    font-size: 27px;\n    font-weight: 600;\n    line-height: 1.2;\n    margin-bottom: 20px;\n    color: var(--ink);\n  }\n  .rmcol ul { list-style: none; margin: 0; padding: 0; }\n  .rmcol li {\n    font-size: 24px;\n    line-height: 1.3;\n    color: var(--ink-2);\n    padding: 10px 0 10px 0;\n    border-top: 1px solid var(--rule);\n  }\n  .rmcol li strong { color: var(--ink); font-weight: 600; display: block; margin-bottom: 2px; }\n  .rmcol li:first-child { border-top: 0; }\n\n  /* ===== Criteria + avoid (two col) ===== */\n  .crit-grid {\n    flex: 1;\n    display: grid;\n    grid-template-columns: 1.1fr 0.9fr;\n    gap: 56px;\n  }\n  .crit-list { display: flex; flex-direction: column; }\n  .crit-list .blk-title, .avoid .blk-title {\n    font-family: 'JetBrains Mono', monospace;\n    font-size: 24px;\n    letter-spacing: 0.08em;\n    text-transform: uppercase;\n    color: var(--pdt);\n    margin-bottom: 18px;\n  }\n  .avoid .blk-title { color: var(--ink-3); }\n  .crit {\n    display: grid;\n    grid-template-columns: 56px 1fr;\n    gap: 18px;\n    align-items: baseline;\n    padding:
